# Production stack for a VPS: the app plus a Postgres with pgvector.
#
#   cp docker/.env.production.example .env.production   # fill every value
#   docker compose -f docker/compose.production.yml --env-file .env.production up -d --build
#
# Differences from the dev compose:
#   - Postgres is NOT exposed to the internet (no ports:) — only the app
#     network can reach it. The app port is bound to 127.0.0.1 so TLS is
#     terminated by your reverse proxy or Cloudvoid-agent Tunnel in front.
#   - Postgres credentials come from the env file (set a strong password).
#   - Healthchecks gate the app on a ready database.
#   - Redis is included by default (resumable chat streams need it in
#     production); remove the service + REDIS_URL to run without it.

services:
  app:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env.production
    environment:
      - NO_HTTPS=1
      - POSTGRES_URL=postgres://voidagent:${POSTGRES_PASSWORD}@postgres:5432/void_agent
      - REDIS_URL=redis://redis:6379
    networks:
      - void-agent
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/auth/ok']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Standalone marketing site (apps/marketing, voidagent.space). Optional:
  # the VPS-native production stack runs it as void-agent-marketing.service
  # instead (see docs/deploy-vps-native.md). It needs only the two
  # NEXT_PUBLIC_* URLs — put them in this env file or a separate one.
  marketing:
    build:
      context: ..
      dockerfile: ./docker/marketing.Dockerfile
    ports:
      - '127.0.0.1:3100:3000'
    environment:
      - NEXT_PUBLIC_MARKETING_URL=${NEXT_PUBLIC_MARKETING_URL:-https://voidagent.space}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://app.voidagent.space}
    networks:
      - void-agent
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=voidagent
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=void_agent
    networks:
      - void-agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voidagent -d void_agent']
      interval: 10s
      timeout: 5s
      retries: 10

  # Free browser provider (self-hosted Steel, Apache-2.0): one active
  # session, live view UI at /ui, CDP over its websocket root. NO AUTH on
  # ports 3000/9223 — keep them off the public internet; only the app and
  # the executor reach it here. If you want the live view from outside,
  # route it through your tunnel/Access, never a bare port.
  steel:
    image: ghcr.io/steel-dev/steel-browser:latest
    environment:
      # Fixes the URLs Steel advertises (websocketUrl/sessionViewerUrl).
      - DOMAIN=steel:3000
      - ENABLE_COMMANDS_API=false
      # B20: Chromium silently bypasses the proxy for loopback by default —
      # this negative bypass rule REMOVES the implicit exemption so loopback
      # traffic also flows through the egress proxy (required with
      # STEEL_EGRESS_PROXY_URL; harmless without one).
      - CHROME_ARGS=--proxy-bypass-list=<-loopback>
    shm_size: 1g
    networks:
      - void-agent
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # B20 egress boundary: the filtering forward proxy every browser session
  # MUST route through (Steel proxyUrl / agent-browser --proxy). Resolves DNS
  # itself, pins the resolved IP, and denies loopback/private/link-local/
  # metadata destinations at the network layer. Internal network only.
  egress-proxy:
    build:
      context: ./egress-proxy
    environment:
      - PORT=8080
      # Comma-separated hostnames exempted from the deny list (rarely needed).
      - EGRESS_ALLOW_HOSTS=
    networks:
      - void-agent
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Isolated Playwright code runner: receives {cdpUrl, code} from the app and
  # executes the agent's code against the Steel session, so model code never
  # runs inside the app server (same property Kernel's hosted runtime gives).
  # Internal network only — it accepts arbitrary code by design.
  steel-executor:
    build:
      context: ./steel-executor
    environment:
      - PORT=8080
    networks:
      - void-agent
    restart: unless-stopped
    depends_on:
      - steel
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    networks:
      - void-agent
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  void-agent:
    driver: bridge
